l_english:
 totalist: "Totalist"
 totalist_noun: "Totalism"
 totalist_desc: "Totalist Regime"
 totalist_subtype: "Totalism"
 totalist_subtype_desc: "Authoritarian revolutionary socialism shaped by the conclusion that decentralized revolution failed. Totalists favor party discipline, security organs, militarized planning, and ideological unity."

 syndicalist: "Syndicalist"
 syndicalist_noun: "Syndicalism"
 syndicalist_desc: "Syndicalist Republic"
 syndicalist_subtype: "Syndicalism"
 syndicalist_subtype_desc: "A revolutionary socialist tradition centered on organized labor, industrial democracy, and worker self-management. After the Second Weltkrieg, syndicalism survives most often as unions, exiles, and underground networks."

 anarchist: "Anarchist"
 anarchist_noun: "Anarchism"
 anarchist_desc: "Anarchist Federation"
 anarchist_subtype: "Anarchism"
 anarchist_subtype_desc: "A revolutionary anti-state current rejecting restored reaction, parliamentary liberalism, state socialism, and totalist party discipline. Anarchists favor local autonomy, direct action, federated communes, and militia self-defense."

 radical_socialist: "Radical Socialist"
 radical_socialist_noun: "Radical Socialism"
 radical_socialist_desc: "Radical Socialist Government"
 radical_socialist_subtype: "Radical Socialism"
 radical_socialist_subtype_desc: "A broad family of revolutionary and left-socialist movements outside strict syndicalist or totalist organization, ranging from agrarian radicalism to anti-colonial socialist movements."

 social_democrat: "Social Democrat"
 social_democrat_noun: "Social Democracy"
 social_democrat_desc: "Social Democratic Government"
 social_democrat_subtype: "Social Democracy"
 social_democrat_subtype_desc: "Democratic labor politics, parliamentary reform, union legalization, welfare compromise, and constitutional answers to the memory of revolution."

 social_liberal: "Social Liberal"
 social_liberal_noun: "Social Liberalism"
 social_liberal_desc: "Social Liberal Government"
 social_liberal_subtype: "Social Liberalism"
 social_liberal_subtype_desc: "Constitutional reconciliation, civil liberties, limited welfare reform, and institutional rebuilding after war, revolution, and emergency rule."

 market_liberal: "Market Liberal"
 market_liberal_noun: "Market Liberalism"
 market_liberal_desc: "Market Liberal Government"
 market_liberal_subtype: "Market Liberalism"
 market_liberal_subtype_desc: "Reconstruction capitalism, trade normalization, debt management, foreign investment, and restrained constitutional government."

 social_conservative: "Social Conservative"
 social_conservative_noun: "Social Conservatism"
 social_conservative_desc: "Social Conservative Government"
 social_conservative_subtype: "Social Conservatism"
 social_conservative_subtype_desc: "Traditional constitutional order, church influence, monarchy or republican respectability, veteran politics, and fear of renewed revolutionary upheaval."

 authoritarian_democrat: "Authoritarian Democrat"
 authoritarian_democrat_noun: "Authoritarian Democracy"
 authoritarian_democrat_desc: "Authoritarian Democratic Government"
 authoritarian_democrat_subtype: "Authoritarian Democracy"
 authoritarian_democrat_subtype_desc: "Managed constitutionalism, emergency rule, military-backed cabinets, royal prerogative, and security-first reconstruction."

 paternal_autocrat: "Paternal Autocrat"
 paternal_autocrat_noun: "Paternal Autocracy"
 paternal_autocrat_desc: "Paternal Autocratic Government"
 paternal_autocrat_subtype: "Paternal Autocracy"
 paternal_autocrat_subtype_desc: "Personalist, military, monarchist, clerical, or bureaucratic rule that preserves order through hierarchy rather than mass ideology."

 national_populist: "National Populist"
 national_populist_noun: "National Populism"
 national_populist_desc: "National Populist Regime"
 national_populist_subtype: "National Populism"
 national_populist_subtype_desc: "Mass nationalist radicalism rooted in humiliation, paramilitary politics, anti-foreign resentment, colonial revolt, or imperial revenge. In the Third Weltkrieg era, it is the radical mass form of revived nationalism."
